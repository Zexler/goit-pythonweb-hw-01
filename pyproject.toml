[project]
name = "goit-pythonweb-hw-01"
version = "0.1.0"
description = "GoIT Python Web homework 01"
authors = [
    {name = "Yakiv"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
]

[tool.poetry]
package-mode = false

[tool.black]
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]
